# Docker Compose for tempest-trading-mcp
# Single-service stack for local/VPS deployment
#
# Usage:
#   # First time: copy .env.example to .env and edit with your values
#   cp .env.example .env
#
#   sg docker -c "docker compose up -d --build"
#   sg docker -c "docker compose ps"
#   sg docker -c "docker compose logs -f"
#   sg docker -c "docker compose down"
#
# Validation (fresh worktree / CI — override the runtime env-file path):
#   sg docker -c "TEMPEST_ENV_FILE=.env.example docker compose config"

services:
  tempest-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tempest-trading-mcp:latest
    restart: unless-stopped
    # Runtime config comes from .env by default so local edits affect the container.
    # For fresh clones / CI validation, override the path with TEMPEST_ENV_FILE=.env.example.
    env_file:
      - ${TEMPEST_ENV_FILE:-.env}
    environment:
      # The reddit-adapter runs on the VPS host, not inside this compose stack.
      # Containers cannot reach the host's 127.0.0.1 directly, so map Docker's
      # host-gateway alias and point the runtime at that host-local adapter.
      REDDIT_ADAPTER_URL: ${REDDIT_ADAPTER_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Safer default: publish to loopback on the host. If you need remote access,
      # expose intentionally behind a reverse proxy, Tailscale, firewall rules,
      # or equivalent trusted-network controls.
      - "127.0.0.1:9001:9001"
    # Healthcheck is defined in Dockerfile (HEALTHCHECK directive) to properly
    # probe the SSE surface via a HEAD request that returns without waiting
    # for the streaming body. Compose inherits the Dockerfile healthcheck.
    # Server binds to 0.0.0.0 in-container (see server.py:SERVER_HOST).
    # No volume mounts needed — service is stateless.
