name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TA_LIB_ARCHIVE: ta-lib-0.4.0-src.tar.gz
  TA_LIB_DOWNLOAD_URL: https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz
  TA_LIB_SHA256: 9ff41efcb1c011a4b4b6dfc91610b06e39b1d7973ed5d4dee55029a0ac4dc651

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install ta-lib system library
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y build-essential curl
          curl --fail --show-error --silent --location --retry 3 "$TA_LIB_DOWNLOAD_URL" -o "$TA_LIB_ARCHIVE"
          echo "$TA_LIB_SHA256  $TA_LIB_ARCHIVE" | sha256sum --check --status
          tar -xzf "$TA_LIB_ARCHIVE"
          cd ta-lib && ./configure && make && sudo make install
          cd .. && rm -rf ta-lib "$TA_LIB_ARCHIVE"
          sudo ldconfig
        env:
          TA_LIBRARY_PATH: /usr/lib
          TA_INCLUDE_PATH: /usr/include

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system ".[dev]"
          uv pip install --system ta-lib

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install ta-lib system library
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y build-essential curl
          curl --fail --show-error --silent --location --retry 3 "$TA_LIB_DOWNLOAD_URL" -o "$TA_LIB_ARCHIVE"
          echo "$TA_LIB_SHA256  $TA_LIB_ARCHIVE" | sha256sum --check --status
          tar -xzf "$TA_LIB_ARCHIVE"
          cd ta-lib && ./configure && make && sudo make install
          cd .. && rm -rf ta-lib "$TA_LIB_ARCHIVE"
          sudo ldconfig
        env:
          TA_LIBRARY_PATH: /usr/lib
          TA_INCLUDE_PATH: /usr/include

      - name: Install dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system ".[dev]"
          uv pip install --system ta-lib

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src/tempest_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
