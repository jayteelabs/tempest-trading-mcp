name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TA_LIB_VERSION: 0.6.8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system "TA-Lib==${TA_LIB_VERSION}"
          uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

  coverage:
    name: Coverage (informational)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system "TA-Lib==${TA_LIB_VERSION}"
          uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        id: coverage
        continue-on-error: true
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/tempest_mcp \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=term-missing

      - name: Render coverage PR comment
        if: always()
        run: |
          python .github/scripts/render_coverage_comment.py \
            --coverage-json coverage.json \
            --output coverage-comment.md \
            --head-sha "${GITHUB_SHA}" \
            --coverage-status "${{ steps.coverage.outcome }}" \
            --workflow-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Post coverage PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- tempest-coverage-comment -->'
            const fallbackBody = [
              marker,
              '## Coverage report (informational)',
              '',
              '> Coverage reporting did not complete cleanly, but it remains non-blocking. Merge gates stay **ruff lint** and **pytest**.',
            ].join('\n')
            const body = fs.existsSync('coverage-comment.md')
              ? fs.readFileSync('coverage-comment.md', 'utf8')
              : fallbackBody

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
