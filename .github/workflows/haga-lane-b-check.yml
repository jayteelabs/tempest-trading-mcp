name: Haga Lane B Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lane-b-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install opencode
        run: npm install -g @opencode-ai/plugin@latest

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          # Truncate if too large for display (GitHub API limit ~65535 chars)
          if [ ${#DIFF} -gt 60000 ]; then
            DIFF="${DIFF:0:60000}"$'n\n[Diff truncated — too large for display]'
            echo "DIFF_TRUNCATED=true" >> $GITHUB_ENV
          fi
          echo "DIFF=$DIFF" >> $GITHUB_ENV

      - name: Run Lane B adversarial review
        id: lane-b
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"

          LANE_B_RESULT=$(opencode run \
            --agent Haga \
            --model minimax/MiniMax-M2.7-highspeed \
            "You are running Lane B (Logic/Edge/Adversarial) review for this PR:

            Repository: $REPO
            PR #: $PR_NUMBER
            Title: $PR_TITLE
            URL: $PR_URL

            Diff (code changes):
            ${{ env.DIFF }}

            Focus: Error states, data transformation, multi-file interactions, edge cases, logic correctness, adversarial/breaker mindset. Be harsh. Look for ways this code can fail, crash, or be exploited.
            Format your response as a structured finding list. For each issue found: severity (Critical/High/Medium/Low), file, line, description, recommendation.
            If no issues found: respond with exactly 'Lane B: PASS — no critical logic concerns identified.'

            IMPORTANT: If you find ANY High or Critical severity issues, your final line must be exactly 'Lane B: FAIL'
            If only Medium/Low or no issues, your final line must be exactly 'Lane B: PASS'")

          echo "LANE_B_RESULT=$LANE_B_RESULT" >> $GITHUB_ENV

          if echo "$LANE_B_RESULT" | grep -q "Lane B: FAIL"; then
            echo "CONCLUSION=failure" >> $GITHUB_ENV
          else
            echo "CONCLUSION=success" >> $GITHUB_ENV
          fi

      - name: Create GitHub Check Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LANE_B_ESCAPED=$(echo "${{ env.LANE_B_RESULT }}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

          CHECK_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/check-runs \
            -d "{
              \"name\": \"Haga Lane B (Code Review)\",
              \"head_sha\": \"${{ github.sha }}\",
              \"status\": \"completed\",
              \"conclusion\": \"${{ env.CONCLUSION }}\",
              \"output\": {
                \"title\": \"Haga Lane B — Logic & Edge Review\",
                \"summary\": \"Lane B result: ${{ env.CONCLUSION }}\",
                \"text\": $LANE_B_ESCAPED
              }
            }")
          echo "Check run response: $CHECK_RESPONSE"
