name: Haga Lane B Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lane-b-check:
    runs-on: [self-hosted, tempesti-01]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate with GitHub App
        id: auth
        run: |
          OUTPUT=$(python3 /home/tempest/bin/github-app-auth.sh /home/tempest/apps/tempest-tradingview-mcp)
          TOKEN=$(echo "$OUTPUT" | grep '^TOKEN=' | sed 's/^TOKEN=//')
          echo "token::$TOKEN"
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff::$DIFF"
          # Store diff in GITHUB_ENV for later use (truncate if too large)
          if [ ${#DIFF} -gt 60000 ]; then
            echo "DIFF_TRUNCATED=true" >> $GITHUB_ENV
            DIFF="${DIFF:0:60000}"
            DIFF="$DIFF\n\n[Diff truncated - too large for display]"
          fi
          echo "DIFF=$DIFF" >> $GITHUB_ENV

      - name: Run Lane B adversarial review
        id: lane-b
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"
          
          LANE_B_RESULT=$(/home/tempest/.opencode/bin/opencode run --agent Haga --model minimax/MiniMax-M2.7-highspeed "You are running Lane B (Logic/Edge/Adversarial) review for this PR:
          
          Repository: $REPO
          PR #: $PR_NUMBER
          Title: $PR_TITLE
          URL: $PR_URL
          
          Diff (code changes):
          ${{ env.DIFF }}
          
          Focus: Error states, data transformation, multi-file interactions, edge cases, logic correctness, adversarial/breaker mindset. Be harsh. Look for ways this code can fail, crash, or be exploited.
          Format your response as a structured finding list. For each issue found: severity (Critical/High/Medium/Low), file, line, description, recommendation.
          If no issues found: respond with exactly 'Lane B: PASS — no critical logic concerns identified.'
          
          IMPORTANT: If you find ANY High or Critical severity issues, your final line must be exactly 'Lane B: FAIL'
          If only Medium/Low or no issues, your final line must be exactly 'Lane B: PASS'")
          
          echo "lane_b_result::$LANE_B_RESULT"
          echo "LANE_B_RESULT=$LANE_B_RESULT" >> $GITHUB_ENV
          
          # Determine conclusion based on result
          if echo "$LANE_B_RESULT" | grep -q "Lane B: FAIL"; then
            echo "CONCLUSION=failure" >> $GITHUB_ENV
          else
            echo "CONCLUSION=success" >> $GITHUB_ENV
          fi

      - name: Parse Lane B result
        id: parse
        run: |
          echo "Conclusion: ${{ env.CONCLUSION }}"
          echo "lane_b_result_text=${{ env.LANE_B_RESULT }}" > parse_output.txt
          # Escape newlines for JSON
          LANE_B_ESCAPED=$(echo "${{ env.LANE_B_RESULT }}" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          echo "LANE_B_ESCAPED=$LANE_B_ESCAPED" >> $GITHUB_ENV

      - name: Create GitHub Check Run
        run: |
          CHECK_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ env.TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/check-runs \
            -d "{
              \"name\": \"Haga Lane B (Code Review)\",
              \"head_sha\": \"${{ github.sha }}\",
              \"status\": \"completed\",
              \"conclusion\": \"${{ env.CONCLUSION }}\",
              \"output\": {
                \"title\": \"Haga Lane B — Logic & Edge Review\",
                \"summary\": \"Lane B adversarial testing result: ${{ env.CONCLUSION }}\",
                \"text\": ${{ env.LANE_B_ESCAPED }}
              }
            }")
          echo "Check run response: $CHECK_RESPONSE"
