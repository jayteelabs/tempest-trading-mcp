# Haga Lane B — adversarial code review check
name: Haga Lane B Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lane-b-check:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -L "https://github.com/$REPO/pull/$PR_NUM.diff" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o /tmp/pr_diff.txt
          DIFF_LEN=$(wc -c < /tmp/pr_diff.txt)
          echo "DIFF_LEN=$DIFF_LEN"
          if [ "$DIFF_LEN" -gt 60000 ]; then
            head -c 60000 /tmp/pr_diff.txt > /tmp/pr_diff_truncated.txt
            echo -e "\n\n[Diff truncated — too large for display]" >> /tmp/pr_diff_truncated.txt
            mv /tmp/pr_diff_truncated.txt /tmp/pr_diff.txt
            echo "DIFF_TRUNCATED=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Lane B adversarial review
        id: lane-b
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"
          DIFF=$(cat /tmp/pr_diff.txt)

          LANE_B_RESULT=$(/home/tempest/.opencode/bin/opencode run \
            --agent Haga \
            --model minimax/MiniMax-M2.7-highspeed \
            "You are running Lane B (Logic/Edge/Adversarial) review for this PR:

            Repository: $REPO
            PR #: $PR_NUMBER
            Title: $PR_TITLE
            URL: $PR_URL

            Diff (code changes):
            $DIFF

            Focus: Error states, data transformation, multi-file interactions, edge cases, logic correctness, adversarial/breaker mindset. Be harsh. Look for ways this code can fail, crash, or be exploited.
            Format your response as a structured finding list. For each issue found: severity (Critical/High/Medium/Low), file, line, description, recommendation.
            If no issues found: respond with exactly 'Lane B: PASS — no critical logic concerns identified.'

            IMPORTANT: If you find ANY High or Critical severity issues, your final line must be exactly 'Lane B: FAIL'
            If only Medium/Low or no issues, your final line must be exactly 'Lane B: PASS'")

          echo "$LANE_B_RESULT" > /tmp/lane_b_result.txt
          if echo "$LANE_B_RESULT" | grep -q "Lane B: FAIL"; then
            echo "CONCLUSION=failure" >> $GITHUB_OUTPUT
          else
            echo "CONCLUSION=success" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Check Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LANE_B_RESULT=$(cat /tmp/lane_b_result.txt)
          CONCLUSION=$(grep -q "Lane B: FAIL" /tmp/lane_b_result.txt && echo "failure" || echo "success")

          python3 << 'PYEOF'
import json, urllib.request, os

lane_b_result = open('/tmp/lane_b_result.txt').read()
conclusion = os.environ['CONCLUSION']

payload = {
    "name": "Haga Lane B (Code Review)",
    "head_sha": os.environ['GITHUB_SHA'],
    "status": "completed",
    "conclusion": conclusion,
    "output": {
        "title": "Haga Lane B — Logic & Edge Review",
        "summary": f"Lane B result: {conclusion}",
        "text": lane_b_result
    }
}

data = json.dumps(payload).encode()
req = urllib.request.Request(
    f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
    data=data,
    headers={
        "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "Content-Type": "application/json"
    },
    method="POST"
)
with urllib.request.urlopen(req) as resp:
    print(resp.read().decode())
PYEOF
