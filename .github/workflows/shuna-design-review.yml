name: Shuna Design Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  design-review:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -L "https://github.com/$REPO/pull/$PR_NUM.diff" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -o /tmp/pr_diff.txt
          DIFF_LEN=$(wc -c < /tmp/pr_diff.txt)
          echo "DIFF_LEN=$DIFF_LEN"
          if [ "$DIFF_LEN" -gt 60000 ]; then
            head -c 60000 /tmp/pr_diff.txt > /tmp/pr_diff_truncated.txt
            echo -e "\n\n[Diff truncated — too large for display]" >> /tmp/pr_diff_truncated.txt
            mv /tmp/pr_diff_truncated.txt /tmp/pr_diff.txt
            echo "DIFF_TRUNCATED=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Shuna design review
        id: shuna-review
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"
          DIFF=$(cat /tmp/pr_diff.txt)

          SHUNA_RESULT=$(/home/tempest/.opencode/bin/opencode run \
            --agent "shuna" \
            --model minimax/MiniMax-M2.7-highspeed \
            "You are Shuna running a PR design review for this repository.

            Repository: $REPO
            PR #: $PR_NUMBER
            Title: $PR_TITLE
            URL: $PR_URL

            Diff (code changes):
            $DIFF

            Focus on design quality and ticket-to-implementation alignment:
            - architecture consistency and module placement
            - interface correctness and backwards compatibility
            - naming, cohesion, and separation of concerns
            - dependency hygiene and config correctness
            - whether tests/assertions match the actual implementation contracts
            - whether docs/workflows/config updates are missing

            Format findings with severity (High/Medium/Low), file, line, description, and recommendation.
            If no major design issues are found, respond with exactly 'Shuna Review: PASS — no design concerns identified.'

            IMPORTANT: If you find any High severity design or interface issue, your final line must be exactly 'Shuna Review: FAIL'
            If only Medium/Low or no issues, your final line must be exactly 'Shuna Review: PASS'")

          echo "$SHUNA_RESULT" > /tmp/shuna_result.txt
          if echo "$SHUNA_RESULT" | grep -q "Shuna Review: FAIL"; then
            echo "CONCLUSION=failure" >> $GITHUB_OUTPUT
          else
            echo "CONCLUSION=success" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          shuna_result = open('/tmp/shuna_result.txt').read()

          payload = {
              "body": shuna_result
          }

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=data,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PYEOF

      - name: Create GitHub Check Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          shuna_result = open('/tmp/shuna_result.txt').read()
          conclusion = "failure" if "Shuna Review: FAIL" in shuna_result else "success"

          payload = {
              "name": "Shuna Design Review",
              "head_sha": os.environ['GITHUB_SHA'],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": "Shuna — Design Review",
                  "summary": f"Shuna design review result: {conclusion}",
                  "text": shuna_result
              }
          }

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=data,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PYEOF
