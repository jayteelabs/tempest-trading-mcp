name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run mode (skip publish)"
        required: false
        type: boolean
        default: true
  pull_request:
    types: [closed]

jobs:
  build:
    name: Build distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install build --quiet

      - name: Build wheel
        run: python -m build --wheel

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-build:
    name: Validate build artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: List artifacts
        run: ls -la

      - name: Verify wheel is valid
        run: |
          python -m pip install tempest-tradingview-mcp --find-links dist/ --quiet
          python -c "import tempest_mcp; print(f'Installed version: {tempest_mcp.__version__}')"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !github.event.inputs.dry_run
    environment:
      name: testpypi
      url: https://test.pypi.org/projects/tempest-tradingview-mcp
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip_existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    environment:
      name: pypi
      url: https://pypi.org/project/tempest-tradingview-mcp
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  create-github-release:
    name: Create GitHub Release
    needs: [build, test-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !github.event.inputs.dry_run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          version: ${{ github.event.inputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
