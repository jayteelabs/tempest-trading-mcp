[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempest-tradingview-mcp"
version = "0.1.0"
description = "Market data & analytics MCP server — technical indicators, backtesting, and screening for crypto markets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Project Tempest", email = "tempest@jaytee.cloud" }
]
keywords = ["mcp", "market-data", "crypto", "technical-analysis", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.0",
    "ccxt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ta-lib>=0.4.0",
    "structlog>=23.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "vaderSentiment>=3.3.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "vcrpy>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/jayteelabs/tempest-tradingview-mcp"
Repository = "https://github.com/jayteelabs/tempest-tradingview-mcp"
Issues = "https://github.com/jayteelabs/tempest-tradingview-mcp/issues"

[project.scripts]
tempest-mcp = "tempest_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tempest_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["tempest_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "integration: marks tests that require network access",
]

[tool.coverage.run]
# Measure coverage for the main package source.
source = ["src/tempest_mcp"]
# Exclude integration tests from default coverage runs.
omit = [
    "*/tests/*",
    "*/test_*/*.py",
    "*/conftest.py",
]

[tool.coverage.report]
# Show uncovered lines with >= 80% threshold.
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
# Coverage HTML output directory.
directory = "htmlcov"
